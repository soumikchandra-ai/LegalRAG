services:
  legalrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legalrag_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s